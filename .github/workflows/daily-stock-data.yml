name: Daily A-share stock data

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which feed stage to generate"
        required: true
        default: "auction"
        type: choice
        options:
          - overnight
          - sentiment
          - premarket-scan
          - premarket
          - auction
      source:
        description: "Data source"
        required: true
        default: "eastmoney"
        type: choice
        options:
          - eastmoney
          - fixture
  schedule:
    - cron: "17 20 * * 0-4"
    - cron: "17 22 * * 0-4"
    - cron: "17 0 * * 1-5"
    - cron: "37 0 * * 1-5"
    - cron: "25 1 * * 1-5"
    - cron: "32 1 * * 1-5"

permissions:
  contents: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate feed
        run: |
          STAGE="${{ github.event.inputs.stage }}"
          SOURCE="${{ github.event.inputs.source }}"
          if [ -z "$STAGE" ]; then
            if [ "${{ github.event.schedule }}" = "17 20 * * 0-4" ]; then
              STAGE="overnight"
            elif [ "${{ github.event.schedule }}" = "17 22 * * 0-4" ]; then
              STAGE="sentiment"
            elif [ "${{ github.event.schedule }}" = "17 0 * * 1-5" ]; then
              STAGE="premarket-scan"
            elif [ "${{ github.event.schedule }}" = "37 0 * * 1-5" ]; then
              STAGE="premarket"
            else
              STAGE="auction"
            fi
          fi
          if [ -z "$SOURCE" ]; then
            SOURCE="eastmoney"
          fi
          EXTRA_ARGS=""
          if [ "$STAGE" = "overnight" ] || [ "$STAGE" = "sentiment" ] || [ "$STAGE" = "premarket-scan" ]; then
            EXTRA_ARGS="--next-trading-date"
          fi
          python data-job/generate_daily_feed.py --stage "$STAGE" --source "$SOURCE" $EXTRA_ARGS --output-dir data

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: update daily stock feed"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "git push failed after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
