name: Daily A-share stock data

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which feed stage to generate"
        required: true
        default: "auction"
        type: choice
        options:
          - overnight
          - sentiment
          - premarket-scan
          - premarket
          - auction
      source:
        description: "Data source"
        required: true
        default: "eastmoney"
        type: choice
        options:
          - eastmoney
          - fixture
  schedule:
    - cron: "0 20 * * 0-4"
    - cron: "0 22 * * 0-4"
    - cron: "0 0 * * 1-5"
    - cron: "30 0 * * 1-5"
    - cron: "25 1 * * 1-5"

permissions:
  contents: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate feed
        run: |
          STAGE="${{ github.event.inputs.stage }}"
          SOURCE="${{ github.event.inputs.source }}"
          if [ -z "$STAGE" ]; then
            if [ "${{ github.event.schedule }}" = "0 20 * * 0-4" ]; then
              STAGE="overnight"
            elif [ "${{ github.event.schedule }}" = "0 22 * * 0-4" ]; then
              STAGE="sentiment"
            elif [ "${{ github.event.schedule }}" = "0 0 * * 1-5" ]; then
              STAGE="premarket-scan"
            elif [ "${{ github.event.schedule }}" = "30 0 * * 1-5" ]; then
              STAGE="premarket"
            else
              STAGE="auction"
            fi
          fi
          if [ -z "$SOURCE" ]; then
            SOURCE="eastmoney"
          fi
          python data-job/generate_daily_feed.py --stage "$STAGE" --source "$SOURCE" --output-dir data

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: update daily stock feed"
            git push
          fi
