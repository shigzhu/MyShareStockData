name: Daily A-share stock data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1-5"
    - cron: "25 1 * * 1-5"

permissions:
  contents: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate feed
        run: python data-job/generate_daily_feed.py --output-dir data

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today.json data/history
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: update daily stock feed"
            git push
          fi
